<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | James Kim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #ffffff; color: #0f172a; font-family: 'Inter', sans-serif; }
        .clean-card { background-color: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .clean-card-hover:hover { border-color: #cbd5e1; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06); transform: translateY(-2px); }
    </style>
</head>
<body class="antialiased bg-white text-slate-900 selection:bg-slate-200">

    <!-- Navigation Header -->
    <header class="sticky top-0 z-40 w-full bg-white/95 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="../index.html" class="flex items-center space-x-2 group">
                    <span class="text-base font-bold tracking-tight text-slate-950 group-hover:text-slate-600 transition-colors">James Kim</span>
                    <span class="text-slate-300 font-light">|</span>
                    <span class="text-xs font-mono text-slate-600 tracking-wide">Blog</span>
                </a>
                <nav class="flex items-center space-x-6 font-medium text-sm text-slate-600">
                    <a href="../index.html" class="hover:text-slate-950 transition-colors">← Back to Portfolio</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="py-16 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto">
        <div class="mb-12">
            <span class="text-xs font-mono text-slate-500 uppercase tracking-wide">WRITING & INSIGHTS</span>
            <h1 class="text-4xl font-extrabold text-slate-950 tracking-tight mt-1">Articles & Thoughts</h1>
            <p class="text-slate-600 mt-2 text-sm">A place where I document</p>
        </div>

        <!-- Article Card List -->
        <div id="article-list" class="space-y-6"></div>

            <script>
              fetch('./posts.json')
                .then(response => response.json())
                .then(posts => {
                  const container = document.getElementById('article-list');
                  container.innerHTML = posts.map(post => `
                    <a href="${post.url}" class="block clean-card clean-card-hover rounded-2xl p-6 sm:p-8">
                        <div class="flex items-center justify-between text-xs font-mono text-slate-500 mb-3">
                            <span>${post.date}</span>
                            <span class="bg-slate-100 text-slate-800 px-2.5 py-0.5 rounded font-medium">${post.category}</span>
                        </div>
                        <h2 class="text-xl font-bold text-slate-950 hover:text-blue-600 transition-colors">
                            ${post.title}
                        </h2>
                        <p class="text-slate-600 text-sm mt-2 leading-relaxed">
                            ${post.summary}
                        </p>
                        <div class="mt-4 flex items-center text-xs font-semibold text-slate-900">
                            <span>Read Article →</span>
                        </div>
                    </a>
                  `).join('');
                })
                .catch(err => console.error('Error loading posts:', err));
            </script>
    </main>

</body>
</html>
